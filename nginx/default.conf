server { 
    listen 80; #80 if you want to use http, 443 if you want to use https
    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-NginX-Proxy true;
        
        proxy_pass http://nestecomm-cont:4000; # Replace with your backend server address
        proxy_redirect off;
    }
}