version: '2.29.2'
services:
  nestecomm-app:
    build: 
      context: .
      target: production #production stage
    ports:
      - "5155:5000" # map port 5155 of the host to 5000 of the container
      #  5155 -> docker port , 5000 -> local port
    environment:
      - NODE_ENV=.production
    env_file:
      - ./.env